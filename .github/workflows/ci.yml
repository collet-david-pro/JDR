name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint (8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: phpcs

      - name: php -l on every PHP file
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './frontend/*' \
            -not -path './node_modules/*' \
            -not -path './dev/bin/*' \
            -not -path './tests/fixtures/*' \
            -print0 | xargs -0 -r -n1 -P4 php -n -l > /tmp/php-lint.log || { grep -v '^No syntax errors' /tmp/php-lint.log; exit 1; }
          echo "$(wc -l < /tmp/php-lint.log) file(s) checked"

      - name: PHP_CodeSniffer (PSR-12, informative)
        # Informative until the code base is PSR-12 clean; make it blocking afterwards.
        continue-on-error: true
        run: phpcs --standard=phpcs.xml

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        db:
          - { name: 'MariaDB 10.3', image: 'mariadb:10.3' }
          - { name: 'MySQL 8.0', image: 'mysql:8.0' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      JDR_TEST_DB_HOST: 127.0.0.1
      JDR_TEST_DB_PORT: '3306'
      JDR_TEST_DB_NAME: jdr_test
      JDR_TEST_DB_USER: root
      JDR_TEST_DB_PASS: root
      JDR_TEST_DB_PREFIX: jdrt_
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd, zip
          coverage: none

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            if mysqladmin ping -h "$JDR_TEST_DB_HOST" -P "$JDR_TEST_DB_PORT" -u"$JDR_TEST_DB_USER" -p"$JDR_TEST_DB_PASS" --silent; then
              echo "database ready"; break
            fi
            if [ "$i" = 60 ]; then echo "database not ready" >&2; exit 1; fi
            sleep 2
          done
          # Explicit utf8mb4 (MariaDB 10.3 defaults to latin1; service containers take no command args).
          mysql -h "$JDR_TEST_DB_HOST" -P "$JDR_TEST_DB_PORT" -u"$JDR_TEST_DB_USER" -p"$JDR_TEST_DB_PASS" \
            -e "CREATE DATABASE IF NOT EXISTS \`$JDR_TEST_DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; SELECT VERSION();"

      - name: Download PHPUnit
        run: bash dev/get-phpunit.sh

      - name: Run PHPUnit
        run: php dev/bin/phpunit.phar -c phpunit.xml

  frontend:
    name: Front-end (Node 22) and release manifest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      # build = vite build + node ../dev/release.mjs manifest
      - run: npm run build

      - name: Verify manifest.json
        working-directory: .
        run: node dev/release.mjs verify

      - name: Package release archives
        working-directory: .
        run: node dev/release.mjs package

      - uses: actions/upload-artifact@v4
        with:
          name: jdr-dist-${{ github.sha }}
          path: dist/*.zip
          retention-days: 7

  migrations-frozen:
    name: Published migrations unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare migrations/ with main and release tags
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A migration file is NNNN_name.sql|php. Adding one is fine (A);
          # modifying, deleting, renaming or changing its type (M/D/R/T) is not (projet §8.1).
          pattern=$'^(M|D|T|R[0-9]*)\tmigrations/[0-9]{4}_[^/\t]+\\.(sql|php)(\t|$)'
          failed=0

          check() { # $1 = label, remaining = git diff revision arguments
            local label="$1"; shift
            local bad
            bad="$(git diff --name-status "$@" -- migrations/ | grep -E "$pattern" || true)"
            if [ -n "$bad" ]; then
              echo "::error::Published migration(s) changed compared with ${label}:"
              echo "$bad"
              failed=1
            else
              echo "OK: no published migration changed compared with ${label}"
            fi
          }

          if [ "$EVENT" = "pull_request" ]; then
            base="origin/${BASE_REF:-main}"
            check "$base" "${base}...HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            check "previous commit ${BEFORE:0:7}" "$BEFORE" HEAD
          fi

          # Every migration shipped in a release tag is frozen as well.
          for tag in $(git tag --list 'v*'); do
            check "tag ${tag}" "$tag" HEAD
          done

          exit "$failed"

  e2e:
    name: E2E (Playwright, Chromium/Firefox/WebKit)
    # projet §21 / P1 criteria: browser installation on a blank database (with and without
    # JavaScript), accounts, rate limiting, "remember me", suspension, invitations, diagnostic.
    # dev/e2e-serve.sh (started by e2e/playwright.config.ts) copies the deliverable to a temporary
    # folder, recreates the E2E databases and serves them with php -S (ports 8090 and 8091).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: '3306'
      E2E_DB_USER: root
      E2E_DB_PASS: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build the front (assets/, sw.js, manifest.json)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Playwright and its browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            if mysqladmin ping -h "$E2E_DB_HOST" -P "$E2E_DB_PORT" -u"$E2E_DB_USER" -p"$E2E_DB_PASS" --silent; then
              echo "database ready"; break
            fi
            if [ "$i" = 60 ]; then echo "database not ready" >&2; exit 1; fi
            sleep 2
          done

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/logs/
          retention-days: 7
