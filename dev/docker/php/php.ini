; JDR dev settings, close to a typical shared host.
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 30

; Many shared hosts buffer output: keep it on here so the SSE code path
; (ob_end_flush + flush, projet §10.3) is exercised realistically.
output_buffering = 4096
zlib.output_compression = Off

; Development: show everything in the log, nothing in responses.
display_errors = Off
log_errors = On
error_reporting = E_ALL
